spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id : r1
              #              uri : http://localhost:8081
              uri : lb://ACCOUNT-SERVICE
              predicates:
                - Path= /accounts/**
            - id : r2
              #              uri : http://localhost:8082
              uri : lb://TRANSACTION-SERVICE
              predicates:
                - Path= /transactions/**